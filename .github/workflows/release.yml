name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Next version
        id: version
        run: |
          version=$(node scripts/release-version.js --notes "$RUNNER_TEMP/notes.md")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload notes
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            args: ""
            files: dist/*.dmg
          - os: windows-latest
            script: dist:win
            args: --x64
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.script }} -- ${{ matrix.args }} -c.extraMetadata.version=${{ needs.version.outputs.version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" out/build-*/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Streambert $VERSION" \
            --notes-file out/notes/notes.md
